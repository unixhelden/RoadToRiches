[package]
name = "roadtoriches"
version = "0.1.0"
edition = "2021"


[dependencies]
eframe = "0.33" # Das Framework für die GUI
csv = "1.4"      # CSV Verarbeitung
serde = { version = "1.0", features = ["derive"] } # Daten-Serialisierung
serde_json = "1.0"
rfd = "0.16.0"
notify = "8.2"
rodio = { version = "0.19", features = ["mp3"] } # Version 0.21 has Problems on Linux
dirs = "6.0.0"
image = "0.25"
self_update = { version = "0.42", features = ["archive-zip"] }

[build-dependencies]
winres = "0.1"


[profile.release]
opt-level = "z"     # Optimiert auf Dateigröße
lto = true          # Link Time Optimization (macht die Binary kleiner & schneller)
codegen-units = 1   # Verlangsamt das Kompilieren, macht das Ergebnis aber kleiner
panic = "abort"     # Entfernt den Code für "Unwinding" bei Fehlern
strip = true        # Entfernt alle Symbole und Debug-Infos aus der .exe

