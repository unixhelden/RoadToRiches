name: Release Builds

on:
  push:
    tags:
      - 'v*' # Startet, wenn du einen Tag wie v0.1.0 pushst

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: roadtoriches-linux
            asset_name: roadtoriches-linux.zip
          - os: windows-latest
            artifact_name: roadtoriches-windows
            asset_name: roadtoriches-windows.zip

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - name: Build Release
        run: cargo build --release

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          # Extrahiert die Version aus der Cargo.toml
          VERSION=$(grep '^version =' Cargo.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 2. Windows Packaging mit Versionsnummer
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir dist
          cp target/release/roadtoriches.exe dist/
          cd dist
          # Erstellt z.B. roadtoriches-v0.1.1-windows.zip
          7z a ../roadtoriches-v${VERSION}-windows.zip roadtoriches.exe

      # 3. Linux Packaging mit Versionsnummer
      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p package
          cp target/release/roadtoriches package/
          tar -czvf roadtoriches-v${VERSION}-linux.tar.gz -C package .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            roadtoriches-windows.zip
            roadtoriches-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
